---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/api/login":
    post:
      summary: Login user and return JWT token
      tags:
      - Authentication
      parameters: []
      responses:
        '200':
          description: successful login
        '401':
          description: invalid credentials
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - username
              - password
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  example: '123456'
  "/api/devices/{id}/buzzer/available_pirs":
    get:
      summary: List accessible PIRs for linking or moving to this Buzzer
      tags:
      - Buzzer devices
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Rails ID of an accessible Buzzer.
        schema:
          type: integer
      description: Returns accessible PIRs ordered by ID, including legacy and action-mode
        configuration. linked_buzzer contains only accessible target identity. configuration_mode
        tells clients whether legacy editing remains available; action-mode writes
        must use the trigger-actions API.
      responses:
        '200':
          description: available PIRs; empty array when none are accessible
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - available_pirs
                properties:
                  status:
                    type: string
                    enum:
                    - success
                  available_pirs:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - name
                      - chip_id
                      - linked_buzzer
                      - requires_confirmation
                      - configuration_mode
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                          nullable: true
                        chip_id:
                          type: string
                        linked_buzzer:
                          type: object
                          nullable: true
                          required:
                          - id
                          - name
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                              nullable: true
                        requires_confirmation:
                          type: boolean
                        configuration_mode:
                          type: string
                          enum:
                          - none
                          - legacy
                          - actions
                          - invalid_legacy
        '401':
          description: missing or invalid authentication
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '404':
          description: missing, inaccessible, or non-Buzzer target
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  message:
                    type: string
                    example: Buzzer device not found
  "/api/devices/{id}/buzzer/linked_pirs":
    post:
      summary: Link or move an accessible PIR to this Buzzer
      tags:
      - Buzzer devices
      security:
      - bearerAuth: []
      description: 'Legacy configuration only: replaces the PIR trigger with chip_id,
        relay_index and longlast. PIRs with any persisted trigger action return 409
        trigger_actions_managed. Does not publish MQTT.'
      parameters:
      - name: id
        in: path
        required: true
        description: Rails ID of an accessible Buzzer.
        schema:
          type: integer
      responses:
        '200':
          description: PIR linked with normalized configuration
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - linked_pir
                properties:
                  status:
                    type: string
                    enum:
                    - success
                  linked_pir:
                    type: object
                    required:
                    - id
                    - name
                    - chip_id
                    - relay_index
                    - longlast
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                        nullable: true
                      chip_id:
                        type: string
                      relay_index:
                        type: integer
                        minimum: 0
                      longlast:
                        type: integer
                        minimum: 100
                        maximum: 10000
        '401':
          description: missing or invalid authentication
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '404':
          description: Buzzer or PIR is missing, inaccessible, or the wrong device
            type
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  message:
                    type: string
                    example: PIR device not found
        '422':
          description: missing or invalid pir_id, relay_index, or longlast; JSON integers
            required
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  message:
                    type: string
                    example: longlast must be an integer between 100 and 10000 ms.
        '409':
          description: PIR is managed by persisted trigger actions
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - code
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  code:
                    type: string
                    enum:
                    - trigger_actions_managed
                  message:
                    type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - pir_id
              - relay_index
              - longlast
              properties:
                pir_id:
                  type: integer
                  minimum: 1
                  example: 7
                relay_index:
                  type: integer
                  minimum: 0
                  example: 0
                longlast:
                  type: integer
                  minimum: 100
                  maximum: 10000
                  example: 1000
                  description: Duration in milliseconds.
        required: true
    get:
      summary: List PIR devices linked to a Buzzer
      tags:
      - Buzzer devices
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Rails devices.id of an accessible Buzzer device.
        example: 42
        schema:
          type: integer
      responses:
        '200':
          description: linked PIR devices
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - linked_pirs
                properties:
                  status:
                    type: string
                    enum:
                    - success
                  linked_pirs:
                    type: array
                    description: Accessible PIRs resolved from persisted trigger actions
                      or legacy trigger JSON. Action rows take precedence and disabled
                      rows suppress legacy fallback. Empty array when none match.
                    items:
                      type: object
                      required:
                      - id
                      - name
                      - chip_id
                      - relay_index
                      - longlast
                      - configuration_mode
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                          nullable: true
                        chip_id:
                          type: string
                        relay_index:
                          description: Stored trigger.relay_index JSON value, without
                            coercion; defaults to 0 when null or false.
                          example: 0
                        longlast:
                          nullable: true
                          description: Resolved duration in milliseconds.
                          example: 1000
                        configuration_mode:
                          type: string
                          enum:
                          - legacy
                          - actions
        '401':
          description: missing or invalid JWT
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '404':
          description: Buzzer is missing, inaccessible, or not a Buzzer
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  message:
                    type: string
  "/api/devices/{id}/buzzer/linked_pirs/{pir_id}":
    delete:
      summary: Unlink an accessible PIR from this Buzzer
      tags:
      - Buzzer devices
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Rails ID of an accessible Buzzer.
        schema:
          type: integer
      - name: pir_id
        in: path
        required: true
        description: Rails ID of an accessible PIR.
        schema:
          type: integer
      description: Body-less legacy configuration operation. Removes matching legacy
        command fields while retaining other metadata. PIRs with any persisted trigger
        action return 409 trigger_actions_managed. Never publishes MQTT.
      responses:
        '200':
          description: PIR is no longer linked to this Buzzer, or no matching configuration
            was found
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - pir_id
                properties:
                  status:
                    type: string
                    enum:
                    - success
                  pir_id:
                    type: integer
        '401':
          description: missing or invalid authentication
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '404':
          description: Buzzer or PIR is missing, inaccessible, or the wrong device
            type; invalid path PIR ID
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  message:
                    type: string
                    example: PIR device not found
        '409':
          description: PIR is managed by persisted trigger actions
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - code
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  code:
                    type: string
                    enum:
                    - trigger_actions_managed
                  message:
                    type: string
  "/api/devices/{id}/buzzer":
    get:
      summary: Get Buzzer details
      tags:
      - Buzzer devices
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: ID of an accessible Buzzer device.
        example: 42
        schema:
          type: integer
      responses:
        '200':
          description: Buzzer details
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - buzzer
                properties:
                  status:
                    type: string
                    enum:
                    - success
                  buzzer:
                    type: object
                    required:
                    - id
                    - name
                    - chip_id
                    - device_type
                    - online
                    - last_seen
                    - linked_pir_count
                    - last_triggered_at
                    properties:
                      id:
                        type: integer
                        example: 42
                      name:
                        type: string
                        nullable: true
                        example: Hall Buzzer
                      chip_id:
                        type: string
                        example: ESP32_BUZZER_02
                      device_type:
                        type: string
                        enum:
                        - buzzer
                      online:
                        type: boolean
                        example: true
                        description: True when device_info.update_at is more recent
                          than five minutes ago.
                      last_seen:
                        type: string
                        format: date-time
                        nullable: true
                        description: Parsed meta_info.last_seen; null when absent
                          or unparseable.
                      linked_pir_count:
                        type: integer
                        minimum: 0
                        example: 2
                      last_triggered_at:
                        type: string
                        format: date-time
                        nullable: true
                        description: Latest matching PIR event timestamp; null when
                          there is no matching history.
        '401':
          description: missing or invalid JWT
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '404':
          description: Buzzer is missing, inaccessible, or not a Buzzer
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  message:
                    type: string
                    example: Buzzer device not found
  "/api/devices/{id}/buzzer/history":
    get:
      summary: List recent PIR triggers targeting a Buzzer
      tags:
      - Buzzer devices
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Rails devices.id of an accessible Buzzer device.
        example: 42
        schema:
          type: integer
      responses:
        '200':
          description: latest 20 matching events, newest first
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - events
                properties:
                  status:
                    type: string
                    enum:
                    - success
                  events:
                    type: array
                    maxItems: 20
                    description: Latest 20 motion events for this target, combining
                      immutable action execution snapshots with legacy payload.target_chip_id
                      events. Ordered by occurred_at descending then id descending.
                    items:
                      type: object
                      required:
                      - id
                      - event_type
                      - occurred_at
                      - pir
                      - relay_index
                      - longlast
                      - execution_status
                      - error_code
                      properties:
                        id:
                          type: integer
                        event_type:
                          type: string
                          enum:
                          - motion_detected
                        occurred_at:
                          type: string
                          format: date-time
                        pir:
                          type: object
                          required:
                          - id
                          - name
                          - chip_id
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                              nullable: true
                            chip_id:
                              type: string
                        relay_index:
                          nullable: true
                          description: Stored payload.relay_index JSON value, without
                            coercion; null when absent.
                          example: 0
                        longlast:
                          nullable: true
                          description: Execution snapshot or legacy payload duration
                            in milliseconds.
                          example: 1000
                        execution_status:
                          type: string
                          nullable: true
                          enum:
                          - pending_publish
                          - pending_enqueue
                          - queued
                          - publish_attempted
                          - publish_returned
                          - failed
                          - skipped
                          description: Null for historical legacy events.
                        error_code:
                          type: string
                          nullable: true
                          description: Machine-readable execution failure/skip code;
                            null otherwise.
                          example: invalid_relay_index
        '401':
          description: missing or invalid JWT
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '404':
          description: Buzzer is missing, inaccessible, or not a Buzzer
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  message:
                    type: string
  "/api/devices/{id}/buzzer/test":
    post:
      summary: Send a test command to a Buzzer
      description: Body-less POST using the first configured relay and a three-second
        per-Buzzer cooldown. Success means Rails completed its existing MQTT publish
        call and recorded the request. It does not guarantee broker PUBACK or physical-device
        receipt, activation, or sound.
      tags:
      - Buzzer devices
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Rails devices.id of an accessible Buzzer device.
        example: 42
        schema:
          type: integer
      responses:
        '200':
          description: command published by Rails using existing MQTT semantics
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                - relay_index
                - longlast
                properties:
                  status:
                    type: string
                    enum:
                    - success
                  message:
                    type: string
                    example: Command sent to MQTT broker
                  relay_index:
                    type: integer
                    enum:
                    - 0
                    example: 0
                  longlast:
                    type: integer
                    minimum: 100
                    maximum: 10000
                    description: Configured duration in milliseconds.
                    example: 1000
        '401':
          description: missing or invalid JWT
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '404':
          description: Buzzer is missing, inaccessible, or not a Buzzer
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  message:
                    type: string
        '422':
          description: invalid Buzzer configuration
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  message:
                    type: string
        '429':
          description: test cooldown is active
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  message:
                    type: string
        '503':
          description: MQTT publish failed
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  message:
                    type: string
  "/api/devices/motion_stats":
    get:
      summary: Get hourly motion counts for a PIR device on one date
      tags:
      - PIR devices
      security:
      - bearerAuth: []
      parameters:
      - name: chip_id
        in: query
        required: true
        description: Chip ID of a PIR device the authenticated user can access.
        example: esp8266_14522670
        schema:
          type: string
      - name: date
        in: query
        format: date
        required: false
        description: Date to aggregate, in YYYY-MM-DD. Defaults to today in the application
          time zone.
        example: '2026-09-15'
        schema:
          type: string
      responses:
        '200':
          description: hourly motion statistics
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - date
                - labels
                - values
                - total
                properties:
                  status:
                    type: string
                    enum:
                    - success
                    example: success
                  date:
                    type: string
                    format: date
                    example: '2026-09-15'
                  labels:
                    type: array
                    minItems: 24
                    maxItems: 24
                    items:
                      type: string
                    example:
                    - '00:00'
                    - '01:00'
                    - '02:00'
                  values:
                    type: array
                    minItems: 24
                    maxItems: 24
                    items:
                      type: integer
                      minimum: 0
                    example:
                    - 0
                    - 1
                    - 3
                  total:
                    type: integer
                    minimum: 0
                    example: 4
                  recent_events:
                    type: array
                    maxItems: 20
                    description: Latest motion events for this device, newest first,
                      independent of selected date.
                    items:
                      type: object
                      required:
                      - id
                      - event_type
                      - occurred_at
                      properties:
                        id:
                          type: integer
                        event_type:
                          type: string
                          enum:
                          - motion_detected
                        occurred_at:
                          type: string
                          format: date-time
        '401':
          description: missing or invalid JWT
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '404':
          description: PIR device not found or unavailable to the authenticated user
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  message:
                    type: string
                    example: PIR device not found
        '422':
          description: invalid date format
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  message:
                    type: string
                    example: Invalid date. Use YYYY-MM-DD.
  "/api/devices/motion_heatmap":
    get:
      summary: Get daily motion counts for the PIR heatmap
      tags:
      - PIR devices
      security:
      - bearerAuth: []
      parameters:
      - name: chip_id
        in: query
        required: true
        description: Chip ID of a PIR device the authenticated user can access.
        example: esp8266_14522670
        schema:
          type: string
      - name: days
        in: query
        required: false
        description: Number of days ending today. Defaults to 30; accepted range is
          1 to 90.
        minimum: 1
        maximum: 90
        default: 30
        example: 30
        schema:
          type: integer
      responses:
        '200':
          description: daily motion counts for the heatmap
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - from
                - to
                - max_count
                - data
                properties:
                  status:
                    type: string
                    enum:
                    - success
                    example: success
                  from:
                    type: string
                    format: date
                    example: '2026-08-17'
                  to:
                    type: string
                    format: date
                    example: '2026-09-15'
                  max_count:
                    type: integer
                    minimum: 0
                    example: 12
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - date
                      - count
                      properties:
                        date:
                          type: string
                          format: date
                          example: '2026-09-15'
                        count:
                          type: integer
                          minimum: 0
                          example: 4
        '401':
          description: missing or invalid JWT
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '404':
          description: PIR device not found or unavailable to the authenticated user
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  message:
                    type: string
                    example: PIR device not found
  "/api/devices/{chip_id}/trigger_actions":
    parameters:
    - name: chip_id
      in: path
      required: true
      description: Chip ID of an accessible PIR source device.
      schema:
        type: string
    get:
      summary: List the effective PIR trigger configuration
      tags:
      - PIR trigger actions
      security:
      - bearerAuth: []
      responses:
        '200':
          description: canonical source configuration and effective actions
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - status
                - configuration_mode
                - source_device
                - actions
                properties:
                  status:
                    type: string
                    enum:
                    - success
                  configuration_mode:
                    type: string
                    enum:
                    - none
                    - legacy
                    - actions
                    - invalid_legacy
                  source_device:
                    type: object
                    additionalProperties: false
                    required:
                    - id
                    - name
                    - chip_id
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                        nullable: true
                      chip_id:
                        type: string
                  actions:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - id
                      - origin
                      - action_type
                      - target
                      - relay_index
                      - duration_ms
                      - delay_ms
                      - enabled
                      - position
                      properties:
                        id:
                          type: integer
                          nullable: true
                        origin:
                          type: string
                          enum:
                          - persisted
                          - legacy
                        action_type:
                          type: string
                          enum:
                          - relay_pulse
                        target:
                          type: object
                          nullable: true
                          additionalProperties: false
                          required:
                          - id
                          - chip_id
                          - name
                          - device_type
                          properties:
                            id:
                              type: integer
                            chip_id:
                              type: string
                            name:
                              type: string
                              nullable: true
                            device_type:
                              type: string
                              enum:
                              - switch
                              - buzzer
                        relay_index:
                          type: integer
                          minimum: 0
                        duration_ms:
                          type: integer
                          minimum: 100
                          maximum: 86400000
                        delay_ms:
                          type: integer
                          minimum: 0
                          maximum: 0
                        enabled:
                          type: boolean
                        position:
                          type: integer
                          minimum: 0
        '401':
          description: authentication required
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '404':
          description: source missing or inaccessible
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - code
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  code:
