  "/api/auth/social_identities":
    post:
      summary: Link a Google identity to the authenticated Binblog user
      tags:
      - Authentication
      security:
      - bearerAuth: []
      description: Requires a Binblog Bearer JWT and current local password as fresh
        reauthentication. A passwordless account without local reauthentication cannot
        link through this endpoint.
      parameters: []
      responses:
        '400':
          description: malformed request
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - code
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  code:
                    type: string
                    enum:
                    - malformed_request
        '200':
          description: linked or already linked to the same user
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - code
                properties:
                  status:
                    type: string
                    enum:
                    - success
                  code:
                    type: string
                    enum:
                    - linked
                    - already_linked
        '401':
          description: Binblog authentication required
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - code
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  code:
                    type: string
                    enum:
                    - authentication_required
                    - invalid_provider_credential
        '403':
          description: fresh local-password proof required
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - code
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  code:
                    type: string
                    enum:
                    - reauthentication_required
        '422':
          description: unsupported provider
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - code
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  code:
                    type: string
                    enum:
                    - unsupported_provider
        '500':
          description: identity persistence failure
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - code
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  code:
                    type: string
                    enum:
                    - internal_error
        '503':
          description: provider verification unavailable
