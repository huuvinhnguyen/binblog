---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/api/login":
    post:
      summary: Login user and return JWT token
      tags:
      - Authentication
      parameters: []
      responses:
        '200':
          description: successful login
        '401':
          description: invalid credentials
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - username
              - password
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  example: '123456'
  "/api/devices/{id}/buzzer":
    get:
      summary: Get Buzzer details
      tags:
      - Buzzer devices
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: ID of an accessible Buzzer device.
        example: 42
        schema:
          type: integer
      responses:
        '200':
          description: Buzzer details
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - buzzer
                properties:
                  status:
                    type: string
                    enum:
                    - success
                  buzzer:
                    type: object
                    required:
                    - id
                    - name
                    - chip_id
                    - device_type
                    - online
                    - last_seen
                    - linked_pir_count
                    - last_triggered_at
                    properties:
                      id:
                        type: integer
                        example: 42
                      name:
                        type: string
                        nullable: true
                        example: Hall Buzzer
                      chip_id:
                        type: string
                        example: ESP32_BUZZER_02
                      device_type:
                        type: string
                        enum:
                        - buzzer
                      online:
                        type: boolean
                        example: true
                        description: True when device_info.update_at is more recent
                          than five minutes ago.
                      last_seen:
                        type: string
                        format: date-time
                        nullable: true
                        description: Parsed meta_info.last_seen; null when absent
                          or unparseable.
                      linked_pir_count:
                        type: integer
                        minimum: 0
                        example: 2
                      last_triggered_at:
                        type: string
                        format: date-time
                        nullable: true
                        description: Latest matching PIR event timestamp; null when
                          there is no matching history.
        '401':
          description: missing or invalid JWT
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '404':
          description: Buzzer is missing, inaccessible, or not a Buzzer
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  message:
                    type: string
                    example: Buzzer device not found
  "/api/devices/{id}/buzzer/linked_pirs":
    get:
      summary: List PIR devices linked to a Buzzer
      tags:
      - Buzzer devices
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Rails devices.id of an accessible Buzzer device.
        example: 42
        schema:
          type: integer
      responses:
        '200':
          description: linked PIR devices
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - linked_pirs
                properties:
                  status:
                    type: string
                    enum:
                    - success
                  linked_pirs:
                    type: array
                    description: Accessible PIRs whose trigger.chip_id matches this
                      Buzzer. Empty array when none match.
                    items:
                      type: object
                      required:
                      - id
                      - name
                      - chip_id
                      - relay_index
                      - longlast
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                          nullable: true
                        chip_id:
                          type: string
                        relay_index:
                          description: Stored trigger.relay_index JSON value, without
                            coercion; defaults to 0 when null or false.
                          example: 0
                        longlast:
                          nullable: true
                          description: Stored trigger.longlast JSON value, without
                            coercion; null when absent. Duration in milliseconds.
                          example: 1000
        '401':
          description: missing or invalid JWT
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '404':
          description: Buzzer is missing, inaccessible, or not a Buzzer
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  message:
                    type: string
  "/api/devices/{id}/buzzer/history":
    get:
      summary: List recent PIR triggers targeting a Buzzer
      tags:
      - Buzzer devices
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Rails devices.id of an accessible Buzzer device.
        example: 42
        schema:
          type: integer
      responses:
        '200':
          description: latest 20 matching events, newest first
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - events
                properties:
                  status:
                    type: string
                    enum:
                    - success
                  events:
                    type: array
                    maxItems: 20
                    description: Latest 20 motion_detected events from accessible
                      linked PIRs with matching payload.target_chip_id, ordered by
                      occurred_at descending then id descending. Empty array when
                      none match; events without target metadata are excluded.
                    items:
                      type: object
                      required:
                      - id
                      - event_type
                      - occurred_at
                      - pir
                      - relay_index
                      - longlast
                      properties:
                        id:
                          type: integer
                        event_type:
                          type: string
                          enum:
                          - motion_detected
                        occurred_at:
                          type: string
                          format: date-time
                        pir:
                          type: object
                          required:
                          - id
                          - name
                          - chip_id
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                              nullable: true
                            chip_id:
                              type: string
                        relay_index:
                          nullable: true
                          description: Stored payload.relay_index JSON value, without
                            coercion; null when absent.
                          example: 0
                        longlast:
                          nullable: true
                          description: Stored payload.longlast JSON value, without
                            coercion; null when absent. Duration in milliseconds.
                          example: 1000
        '401':
          description: missing or invalid JWT
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '404':
          description: Buzzer is missing, inaccessible, or not a Buzzer
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  message:
                    type: string
  "/api/devices/{id}/buzzer/test":
    post:
      summary: Send a test command to a Buzzer
      description: Body-less POST using the first configured relay and a three-second
        per-Buzzer cooldown. Success means Rails completed its existing MQTT publish
        call and recorded the request. It does not guarantee broker PUBACK or physical-device
        receipt, activation, or sound.
      tags:
      - Buzzer devices
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Rails devices.id of an accessible Buzzer device.
        example: 42
        schema:
          type: integer
      responses:
        '200':
          description: command published by Rails using existing MQTT semantics
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                - relay_index
                - longlast
                properties:
                  status:
                    type: string
                    enum:
                    - success
                  message:
                    type: string
                    example: Command sent to MQTT broker
                  relay_index:
                    type: integer
                    enum:
                    - 0
                    example: 0
                  longlast:
                    type: integer
                    minimum: 100
                    maximum: 10000
                    description: Configured duration in milliseconds.
                    example: 1000
        '401':
          description: missing or invalid JWT
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '404':
          description: Buzzer is missing, inaccessible, or not a Buzzer
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  message:
                    type: string
        '422':
          description: invalid Buzzer configuration
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  message:
                    type: string
        '429':
          description: test cooldown is active
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  message:
                    type: string
        '503':
          description: MQTT publish failed
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  message:
                    type: string
  "/api/devices/motion_stats":
    get:
      summary: Get hourly motion counts for a PIR device on one date
      tags:
      - PIR devices
      security:
      - bearerAuth: []
      parameters:
      - name: chip_id
        in: query
        required: true
        description: Chip ID of a PIR device the authenticated user can access.
        example: esp8266_14522670
        schema:
          type: string
      - name: date
        in: query
        format: date
        required: false
        description: Date to aggregate, in YYYY-MM-DD. Defaults to today in the application
          time zone.
        example: '2026-09-15'
        schema:
          type: string
      responses:
        '200':
          description: hourly motion statistics
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - date
                - labels
                - values
                - total
                properties:
                  status:
                    type: string
                    enum:
                    - success
                    example: success
                  date:
                    type: string
                    format: date
                    example: '2026-09-15'
                  labels:
                    type: array
                    minItems: 24
                    maxItems: 24
                    items:
                      type: string
                    example:
                    - '00:00'
                    - '01:00'
                    - '02:00'
                  values:
                    type: array
                    minItems: 24
                    maxItems: 24
                    items:
                      type: integer
                      minimum: 0
                    example:
                    - 0
                    - 1
                    - 3
                  total:
                    type: integer
                    minimum: 0
                    example: 4
                  recent_events:
                    type: array
                    maxItems: 20
                    description: Latest motion events for this device, newest first,
                      independent of selected date.
                    items:
                      type: object
                      required:
                      - id
                      - event_type
                      - occurred_at
                      properties:
                        id:
                          type: integer
                        event_type:
                          type: string
                          enum:
                          - motion_detected
                        occurred_at:
                          type: string
                          format: date-time
        '401':
          description: missing or invalid JWT
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '404':
          description: PIR device not found or unavailable to the authenticated user
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  message:
                    type: string
                    example: PIR device not found
        '422':
          description: invalid date format
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  message:
                    type: string
                    example: Invalid date. Use YYYY-MM-DD.
  "/api/devices/motion_heatmap":
    get:
      summary: Get daily motion counts for the PIR heatmap
      tags:
      - PIR devices
      security:
      - bearerAuth: []
      parameters:
      - name: chip_id
        in: query
        required: true
        description: Chip ID of a PIR device the authenticated user can access.
        example: esp8266_14522670
        schema:
          type: string
      - name: days
        in: query
        required: false
        description: Number of days ending today. Defaults to 30; accepted range is
          1 to 90.
        minimum: 1
        maximum: 90
        default: 30
        example: 30
        schema:
          type: integer
      responses:
        '200':
          description: daily motion counts for the heatmap
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - from
                - to
                - max_count
                - data
                properties:
                  status:
                    type: string
                    enum:
                    - success
                    example: success
                  from:
                    type: string
                    format: date
                    example: '2026-08-17'
                  to:
                    type: string
                    format: date
                    example: '2026-09-15'
                  max_count:
                    type: integer
                    minimum: 0
                    example: 12
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - date
                      - count
                      properties:
                        date:
                          type: string
                          format: date
                          example: '2026-09-15'
                        count:
                          type: integer
                          minimum: 0
                          example: 4
        '401':
          description: missing or invalid JWT
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '404':
          description: PIR device not found or unavailable to the authenticated user
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  message:
                    type: string
                    example: PIR device not found
  "/api/devices/trigger":
    post:
      summary: Publish the configured device trigger through MQTT
      tags:
      - Devices
      parameters: []
      responses:
        '200':
          description: trigger message published successfully
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - success
                    example: success
                  message:
                    type: string
                    example: Message sent successfully
        '422':
          description: stored trigger is not valid JSON
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                    example: error
                  message:
                    type: string
                    example: Invalid JSON format
        '404':
          description: device is not found
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                    example: error
                  message:
                    type: string
                    example: Device not found
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - chip_id
              properties:
                chip_id:
                  type: string
                  description: Chip ID used to find the device whose stored trigger
                    will be published.
                  example: ESP32_ABC123
        required: true
  "/api/devices":
    get:
      summary: List all devices for the authenticated user
      tags:
      - Devices
      security:
      - bearerAuth: []
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  count:
                    type: integer
                  devices:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        chip_id:
                          type: string
                        device_type:
                          type: string
                          nullable: true
                        status:
                          type: integer
                          nullable: true
                        is_payment:
                          type: boolean
                          nullable: true
                        note:
                          type: string
                          nullable: true
                        url_firmware:
                          type: string
                          nullable: true
                        device_info:
                          type: object
                        meta_info:
                          type: object
                        created_at:
                          type: string
                          format: date_time
                          nullable: true
                        updated_at:
                          type: string
                          format: date_time
                          nullable: true
        '401':
          description: unauthorized
  "/devices/notify":
    post:
      summary: Send a device notification to Slack
      tags:
      - Devices Webhook
      parameters: []
      responses:
        '200':
          description: notification received
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - status
                properties:
                  message:
                    type: string
                    example: Notification sent to Slack
                  status:
                    type: string
                    enum:
                    - success
                    - failure
                    example: success
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - message
              properties:
                id:
                  type: string
                  description: The device chip ID.
                  example: ESP32_ABC123
                message:
                  type: string
                  description: Notification text sent to Slack.
                  example: Relay 1 đã bật
                model:
                  type: string
                  description: Device model.
                  example: ESP32
                relay_state:
                  type: integer
                  description: Relay state reported by the device (0 = off, 1 = on).
                  enum:
                  - 0
                  - 1
                  example: 1
                relay_index:
                  type: integer
                  description: Zero-based relay index.
                  minimum: 0
                  example: 0
                name:
                  type: string
                  description: Device name used when the device is first registered.
                  example: Thiết bị phòng khách
        required: true
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT returned by POST /api/login. Send it as Bearer <token>.
servers:
- url: https://{defaultHost}
  variables:
    defaultHost:
      default: www.example.com
