            application/json:
              schema:
                type: object
                required:
                - status
                - code
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  code:
                    type: string
                    enum:
                    - source_not_found
                    - target_not_found
                    - action_not_found
                    - feature_disabled
                    - duplicate_action
                    - action_limit_reached
                    - configuration_mode_conflict
                    - legacy_configuration_requires_reconciliation
                    - invalid_action_type
                    - invalid_relay_index
                    - invalid_duration
                    - invalid_delay
                    - invalid_enabled
                    - invalid_order
                  message:
                    type: string
  "/api/devices/trigger":
    post:
      summary: Persist and synchronously execute the configured device trigger
      tags:
      - Devices
      parameters: []
      responses:
        '200':
          description: trigger request persisted and publish attempts recorded
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - success
                    example: success
                  message:
                    type: string
                    example: Message sent successfully
        '422':
          description: stored trigger is not valid JSON
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                    example: error
                  message:
                    type: string
                    example: Invalid JSON format
        '404':
          description: device is not found
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                    example: error
                  message:
                    type: string
                    example: Device not found
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - chip_id
              properties:
                chip_id:
                  type: string
                  description: Chip ID used to find the source device and resolve
                    its effective trigger configuration.
                  example: ESP32_ABC123
        required: true
  "/api/devices":
    get:
      summary: List all devices for the authenticated user
      tags:
      - Devices
      security:
      - bearerAuth: []
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  count:
                    type: integer
                  devices:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        chip_id:
                          type: string
                        device_type:
                          type: string
                          nullable: true
                        status:
                          type: integer
                          nullable: true
                        is_payment:
                          type: boolean
                          nullable: true
                        note:
                          type: string
                          nullable: true
                        url_firmware:
                          type: string
                          nullable: true
                        device_info:
                          type: object
                        meta_info:
                          type: object
                        created_at:
                          type: string
                          format: date_time
                          nullable: true
                        updated_at:
                          type: string
                          format: date_time
                          nullable: true
        '401':
          description: unauthorized
  "/devices/notify":
    post:
      summary: Send a device notification to Slack
      tags:
      - Devices Webhook
      parameters: []
      responses:
        '200':
          description: notification received
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - status
                properties:
                  message:
                    type: string
                    example: Notification sent to Slack
                  status:
                    type: string
                    enum:
                    - success
                    - failure
                    example: success
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - message
              properties:
                id:
                  type: string
                  description: The device chip ID.
                  example: ESP32_ABC123
                message:
                  type: string
                  description: Notification text sent to Slack.
                  example: Relay 1 đã bật
                model:
                  type: string
                  description: Device model.
                  example: ESP32
                relay_state:
                  type: integer
                  description: Relay state reported by the device (0 = off, 1 = on).
                  enum:
                  - 0
                  - 1
                  example: 1
                relay_index:
                  type: integer
                  description: Zero-based relay index.
                  minimum: 0
                  example: 0
                name:
                  type: string
                  description: Device name used when the device is first registered.
                  example: Thiết bị phòng khách
        required: true
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT returned by POST /api/login. Send it as Bearer <token>.
servers:
- url: https://{defaultHost}
  variables:
    defaultHost:
      default: www.example.com
