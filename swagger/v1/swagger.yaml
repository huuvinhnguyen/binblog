---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/api/login":
    post:
      summary: Login user and return JWT token
      tags:
      - Authentication
      parameters: []
      responses:
        '200':
          description: successful login
        '401':
          description: invalid credentials
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - username
              - password
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  example: '123456'
  "/api/devices/motion_stats":
    get:
      summary: Get hourly motion counts for a PIR device on one date
      tags:
      - PIR devices
      security:
      - bearerAuth: []
      parameters:
      - name: chip_id
        in: query
        required: true
        description: Chip ID of a PIR device the authenticated user can access.
        example: esp8266_14522670
        schema:
          type: string
      - name: date
        in: query
        format: date
        required: false
        description: Date to aggregate, in YYYY-MM-DD. Defaults to today in the application
          time zone.
        example: '2026-09-15'
        schema:
          type: string
      responses:
        '200':
          description: hourly motion statistics
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - date
                - labels
                - values
                - total
                properties:
                  status:
                    type: string
                    enum:
                    - success
                    example: success
                  date:
                    type: string
                    format: date
                    example: '2026-09-15'
                  labels:
                    type: array
                    minItems: 24
                    maxItems: 24
                    items:
                      type: string
                    example:
                    - '00:00'
                    - '01:00'
                    - '02:00'
                  values:
                    type: array
                    minItems: 24
                    maxItems: 24
                    items:
                      type: integer
                      minimum: 0
                    example:
                    - 0
                    - 1
                    - 3
                  total:
                    type: integer
                    minimum: 0
                    example: 4
                  recent_events:
                    type: array
                    maxItems: 20
                    description: Latest motion events for this device, newest first,
                      independent of selected date.
                    items:
                      type: object
                      required:
                      - id
                      - event_type
                      - occurred_at
                      properties:
                        id:
                          type: integer
                        event_type:
                          type: string
                          enum:
                          - motion_detected
                        occurred_at:
                          type: string
                          format: date-time
        '401':
          description: missing or invalid JWT
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '404':
          description: PIR device not found or unavailable to the authenticated user
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  message:
                    type: string
                    example: PIR device not found
        '422':
          description: invalid date format
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  message:
                    type: string
                    example: Invalid date. Use YYYY-MM-DD.
  "/api/devices/motion_heatmap":
    get:
      summary: Get daily motion counts for the PIR heatmap
      tags:
      - PIR devices
      security:
      - bearerAuth: []
      parameters:
      - name: chip_id
        in: query
        required: true
        description: Chip ID of a PIR device the authenticated user can access.
        example: esp8266_14522670
        schema:
          type: string
      - name: days
        in: query
        required: false
        description: Number of days ending today. Defaults to 30; accepted range is
          1 to 90.
        minimum: 1
        maximum: 90
        default: 30
        example: 30
        schema:
          type: integer
      responses:
        '200':
          description: daily motion counts for the heatmap
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - from
                - to
                - max_count
                - data
                properties:
                  status:
                    type: string
                    enum:
                    - success
                    example: success
                  from:
                    type: string
                    format: date
                    example: '2026-08-17'
                  to:
                    type: string
                    format: date
                    example: '2026-09-15'
                  max_count:
                    type: integer
                    minimum: 0
                    example: 12
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - date
                      - count
                      properties:
                        date:
                          type: string
                          format: date
                          example: '2026-09-15'
                        count:
                          type: integer
                          minimum: 0
                          example: 4
        '401':
          description: missing or invalid JWT
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '404':
          description: PIR device not found or unavailable to the authenticated user
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  message:
                    type: string
                    example: PIR device not found
  "/api/devices/trigger":
    post:
      summary: Publish the configured device trigger through MQTT
      tags:
      - Devices
      parameters: []
      responses:
        '200':
          description: trigger message published successfully
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - success
                    example: success
                  message:
                    type: string
                    example: Message sent successfully
        '422':
          description: stored trigger is not valid JSON
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                    example: error
                  message:
                    type: string
                    example: Invalid JSON format
        '404':
          description: device is not found
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                    example: error
                  message:
                    type: string
                    example: Device not found
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - chip_id
              properties:
                chip_id:
                  type: string
                  description: Chip ID used to find the device whose stored trigger
                    will be published.
                  example: ESP32_ABC123
        required: true
  "/api/devices":
    get:
      summary: List all devices for the authenticated user
      tags:
      - Devices
      security:
      - bearerAuth: []
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  count:
                    type: integer
                  devices:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        chip_id:
                          type: string
                        device_type:
                          type: string
                          nullable: true
                        status:
                          type: integer
                          nullable: true
                        is_payment:
                          type: boolean
                          nullable: true
                        note:
                          type: string
                          nullable: true
                        url_firmware:
                          type: string
                          nullable: true
                        device_info:
                          type: object
                        meta_info:
                          type: object
                        created_at:
                          type: string
                          format: date_time
                          nullable: true
                        updated_at:
                          type: string
                          format: date_time
                          nullable: true
        '401':
          description: unauthorized
  "/devices/notify":
    post:
      summary: Send a device notification to Slack
      tags:
      - Devices Webhook
      parameters: []
      responses:
        '200':
          description: notification received
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - status
                properties:
                  message:
                    type: string
                    example: Notification sent to Slack
                  status:
                    type: string
                    enum:
                    - success
                    - failure
                    example: success
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - message
              properties:
                id:
                  type: string
                  description: The device chip ID.
                  example: ESP32_ABC123
                message:
                  type: string
                  description: Notification text sent to Slack.
                  example: Relay 1 đã bật
                model:
                  type: string
                  description: Device model.
                  example: ESP32
                relay_state:
                  type: integer
                  description: Relay state reported by the device (0 = off, 1 = on).
                  enum:
                  - 0
                  - 1
                  example: 1
                relay_index:
                  type: integer
                  description: Zero-based relay index.
                  minimum: 0
                  example: 0
                name:
                  type: string
                  description: Device name used when the device is first registered.
                  example: Thiết bị phòng khách
        required: true
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT returned by POST /api/login. Send it as Bearer <token>.
servers:
- url: https://{defaultHost}
  variables:
    defaultHost:
      default: www.example.com
