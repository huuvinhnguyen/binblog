---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/api/login":
    post:
      summary: Login user and return JWT token
      tags:
      - Authentication
      parameters: []
      responses:
        '200':
          description: successful login
        '401':
          description: invalid credentials
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - username
              - password
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  example: '123456'
  "/api/devices/{id}/buzzer/available_pirs":
    get:
      summary: List accessible PIRs for linking or moving to this Buzzer
      tags:
      - Buzzer devices
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Rails ID of an accessible Buzzer.
        schema:
          type: integer
      description: Returns accessible PIRs ordered by ID, including already linked
        PIRs. linked_buzzer contains only an accessible current Buzzer ID and name;
        otherwise null. requires_confirmation indicates an existing configuration
        that would be replaced. Clients should show Move & Link for a different visible
        Buzzer, or a generic replace-configuration confirmation when its identity
        is unavailable. POST performs the replacement; this flag is advisory, not
        a confirmation token.
      responses:
        '200':
          description: available PIRs; empty array when none are accessible
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - available_pirs
                properties:
                  status:
                    type: string
                    enum:
                    - success
                  available_pirs:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - name
                      - chip_id
                      - linked_buzzer
                      - requires_confirmation
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                          nullable: true
                        chip_id:
                          type: string
                        linked_buzzer:
                          type: object
                          nullable: true
                          required:
                          - id
                          - name
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                              nullable: true
                        requires_confirmation:
                          type: boolean
        '401':
          description: missing or invalid authentication
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '404':
          description: missing, inaccessible, or non-Buzzer target
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  message:
                    type: string
                    example: Buzzer device not found
  "/api/devices/{id}/buzzer/linked_pirs":
    post:
      summary: Link or move an accessible PIR to this Buzzer
      tags:
      - Buzzer devices
      security:
      - bearerAuth: []
      description: 'Configuration only: replaces the PIR trigger with chip_id, relay_index
        and longlast. Repeating the same request produces the same state. Existing
        configuration is replaced, including malformed JSON. Does not connect to MQTT,
        test, or sound the Buzzer.'
      parameters:
      - name: id
        in: path
        required: true
        description: Rails ID of an accessible Buzzer.
        schema:
          type: integer
      responses:
        '200':
          description: PIR linked with normalized configuration
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - linked_pir
                properties:
                  status:
                    type: string
                    enum:
                    - success
                  linked_pir:
                    type: object
                    required:
                    - id
                    - name
                    - chip_id
                    - relay_index
                    - longlast
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                        nullable: true
                      chip_id:
                        type: string
                      relay_index:
                        type: integer
                        minimum: 0
                      longlast:
                        type: integer
                        minimum: 100
                        maximum: 10000
        '401':
          description: missing or invalid authentication
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '404':
          description: Buzzer or PIR is missing, inaccessible, or the wrong device
            type
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  message:
                    type: string
                    example: PIR device not found
        '422':
          description: missing or invalid pir_id, relay_index, or longlast; JSON integers
            required
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  message:
                    type: string
                    example: longlast must be an integer between 100 and 10000 ms.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - pir_id
              - relay_index
              - longlast
              properties:
                pir_id:
                  type: integer
                  minimum: 1
                  example: 7
                relay_index:
                  type: integer
                  minimum: 0
                  example: 0
                longlast:
                  type: integer
                  minimum: 100
                  maximum: 10000
                  example: 1000
                  description: Duration in milliseconds.
        required: true
    get:
      summary: List PIR devices linked to a Buzzer
      tags:
      - Buzzer devices
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Rails devices.id of an accessible Buzzer device.
        example: 42
        schema:
          type: integer
      responses:
        '200':
          description: linked PIR devices
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - linked_pirs
                properties:
                  status:
                    type: string
                    enum:
                    - success
                  linked_pirs:
                    type: array
                    description: Accessible PIRs whose trigger.chip_id matches this
                      Buzzer. Empty array when none match.
                    items:
                      type: object
                      required:
                      - id
                      - name
                      - chip_id
                      - relay_index
                      - longlast
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                          nullable: true
                        chip_id:
                          type: string
                        relay_index:
                          description: Stored trigger.relay_index JSON value, without
                            coercion; defaults to 0 when null or false.
                          example: 0
                        longlast:
                          nullable: true
                          description: Stored trigger.longlast JSON value, without
                            coercion; null when absent. Duration in milliseconds.
                          example: 1000
        '401':
          description: missing or invalid JWT
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '404':
          description: Buzzer is missing, inaccessible, or not a Buzzer
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  message:
                    type: string
  "/api/devices/{id}/buzzer/linked_pirs/{pir_id}":
    delete:
      summary: Unlink an accessible PIR from this Buzzer
      tags:
      - Buzzer devices
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Rails ID of an accessible Buzzer.
        schema:
          type: integer
      - name: pir_id
        in: path
        required: true
        description: Rails ID of an accessible PIR.
        schema:
          type: integer
      description: Body-less, configuration-only operation. Removes command fields
        only if the stored target matches this Buzzer, retaining other metadata. Repeated
        unlink, another target, missing configuration, and malformed existing JSON
        are successful no-ops. A normalized link becomes {}. Never connects to MQTT
        or tests the Buzzer.
      responses:
        '200':
          description: PIR is no longer linked to this Buzzer, or no matching configuration
            was found
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - pir_id
                properties:
                  status:
                    type: string
                    enum:
                    - success
                  pir_id:
                    type: integer
        '401':
          description: missing or invalid authentication
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '404':
          description: Buzzer or PIR is missing, inaccessible, or the wrong device
            type; invalid path PIR ID
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  message:
                    type: string
                    example: PIR device not found
  "/api/devices/{id}/buzzer":
    get:
      summary: Get Buzzer details
      tags:
      - Buzzer devices
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: ID of an accessible Buzzer device.
        example: 42
        schema:
          type: integer
      responses:
        '200':
          description: Buzzer details
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - buzzer
                properties:
                  status:
                    type: string
                    enum:
                    - success
                  buzzer:
                    type: object
                    required:
                    - id
                    - name
                    - chip_id
                    - device_type
                    - online
                    - last_seen
                    - linked_pir_count
                    - last_triggered_at
                    properties:
                      id:
                        type: integer
                        example: 42
                      name:
                        type: string
                        nullable: true
                        example: Hall Buzzer
                      chip_id:
                        type: string
                        example: ESP32_BUZZER_02
                      device_type:
                        type: string
                        enum:
                        - buzzer
                      online:
                        type: boolean
                        example: true
                        description: True when device_info.update_at is more recent
                          than five minutes ago.
                      last_seen:
                        type: string
                        format: date-time
                        nullable: true
                        description: Parsed meta_info.last_seen; null when absent
                          or unparseable.
                      linked_pir_count:
                        type: integer
                        minimum: 0
                        example: 2
                      last_triggered_at:
                        type: string
                        format: date-time
                        nullable: true
                        description: Latest matching PIR event timestamp; null when
                          there is no matching history.
        '401':
          description: missing or invalid JWT
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '404':
          description: Buzzer is missing, inaccessible, or not a Buzzer
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  message:
                    type: string
                    example: Buzzer device not found
  "/api/devices/{id}/buzzer/history":
    get:
      summary: List recent PIR triggers targeting a Buzzer
      tags:
      - Buzzer devices
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Rails devices.id of an accessible Buzzer device.
        example: 42
        schema:
          type: integer
      responses:
        '200':
          description: latest 20 matching events, newest first
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - events
                properties:
                  status:
                    type: string
                    enum:
                    - success
                  events:
                    type: array
                    maxItems: 20
                    description: Latest 20 motion_detected events from accessible
                      linked PIRs with matching payload.target_chip_id, ordered by
                      occurred_at descending then id descending. Empty array when
                      none match; events without target metadata are excluded.
                    items:
                      type: object
                      required:
                      - id
                      - event_type
                      - occurred_at
                      - pir
                      - relay_index
                      - longlast
                      properties:
                        id:
                          type: integer
                        event_type:
                          type: string
                          enum:
                          - motion_detected
                        occurred_at:
                          type: string
                          format: date-time
                        pir:
                          type: object
                          required:
                          - id
                          - name
                          - chip_id
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                              nullable: true
                            chip_id:
                              type: string
                        relay_index:
                          nullable: true
                          description: Stored payload.relay_index JSON value, without
                            coercion; null when absent.
                          example: 0
                        longlast:
                          nullable: true
                          description: Stored payload.longlast JSON value, without
                            coercion; null when absent. Duration in milliseconds.
                          example: 1000
        '401':
          description: missing or invalid JWT
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '404':
          description: Buzzer is missing, inaccessible, or not a Buzzer
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  message:
                    type: string
  "/api/devices/{id}/buzzer/test":
    post:
      summary: Send a test command to a Buzzer
      description: Body-less POST using the first configured relay and a three-second
        per-Buzzer cooldown. Success means Rails completed its existing MQTT publish
        call and recorded the request. It does not guarantee broker PUBACK or physical-device
        receipt, activation, or sound.
      tags:
      - Buzzer devices
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Rails devices.id of an accessible Buzzer device.
        example: 42
        schema:
          type: integer
      responses:
        '200':
          description: command published by Rails using existing MQTT semantics
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                - relay_index
                - longlast
                properties:
                  status:
                    type: string
                    enum:
                    - success
                  message:
                    type: string
                    example: Command sent to MQTT broker
                  relay_index:
                    type: integer
                    enum:
                    - 0
                    example: 0
                  longlast:
                    type: integer
                    minimum: 100
                    maximum: 10000
                    description: Configured duration in milliseconds.
                    example: 1000
        '401':
          description: missing or invalid JWT
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
        '404':
          description: Buzzer is missing, inaccessible, or not a Buzzer
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  message:
                    type: string
        '422':
          description: invalid Buzzer configuration
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  message:
                    type: string
        '429':
          description: test cooldown is active
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  message:
                    type: string
        '503':
          description: MQTT publish failed
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  message:
                    type: string
  "/api/devices/motion_stats":
    get:
      summary: Get hourly motion counts for a PIR device on one date
      tags:
      - PIR devices
      security:
      - bearerAuth: []
      parameters:
      - name: chip_id
        in: query
        required: true
        description: Chip ID of a PIR device the authenticated user can access.
        example: esp8266_14522670
        schema:
          type: string
      - name: date
        in: query
        format: date
        required: false
        description: Date to aggregate, in YYYY-MM-DD. Defaults to today in the application
          time zone.
        example: '2026-09-15'
        schema:
          type: string
      responses:
        '200':
          description: hourly motion statistics
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - date
                - labels
                - values
                - total
                properties:
                  status:
                    type: string
                    enum:
                    - success
                    example: success
                  date:
                    type: string
                    format: date
                    example: '2026-09-15'
                  labels:
                    type: array
                    minItems: 24
                    maxItems: 24
                    items:
                      type: string
                    example:
                    - '00:00'
                    - '01:00'
                    - '02:00'
                  values:
                    type: array
                    minItems: 24
                    maxItems: 24
                    items:
                      type: integer
                      minimum: 0
                    example:
                    - 0
                    - 1
                    - 3
                  total:
                    type: integer
                    minimum: 0
                    example: 4
                  recent_events:
                    type: array
                    maxItems: 20
                    description: Latest motion events for this device, newest first,
                      independent of selected date.
                    items:
                      type: object
                      required:
                      - id
                      - event_type
                      - occurred_at
                      properties:
                        id:
                          type: integer
                        event_type:
                          type: string
                          enum:
                          - motion_detected
                        occurred_at:
                          type: string
                          format: date-time
        '401':
          description: missing or invalid JWT
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '404':
          description: PIR device not found or unavailable to the authenticated user
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  message:
                    type: string
                    example: PIR device not found
        '422':
          description: invalid date format
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  message:
                    type: string
                    example: Invalid date. Use YYYY-MM-DD.
  "/api/devices/motion_heatmap":
    get:
      summary: Get daily motion counts for the PIR heatmap
      tags:
      - PIR devices
      security:
      - bearerAuth: []
      parameters:
      - name: chip_id
        in: query
        required: true
        description: Chip ID of a PIR device the authenticated user can access.
        example: esp8266_14522670
        schema:
          type: string
      - name: days
        in: query
        required: false
        description: Number of days ending today. Defaults to 30; accepted range is
          1 to 90.
        minimum: 1
        maximum: 90
        default: 30
        example: 30
        schema:
          type: integer
      responses:
        '200':
          description: daily motion counts for the heatmap
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - from
                - to
                - max_count
                - data
                properties:
                  status:
                    type: string
                    enum:
                    - success
                    example: success
                  from:
                    type: string
                    format: date
                    example: '2026-08-17'
                  to:
                    type: string
                    format: date
                    example: '2026-09-15'
                  max_count:
                    type: integer
                    minimum: 0
                    example: 12
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - date
                      - count
                      properties:
                        date:
                          type: string
                          format: date
                          example: '2026-09-15'
                        count:
                          type: integer
                          minimum: 0
                          example: 4
        '401':
          description: missing or invalid JWT
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '404':
          description: PIR device not found or unavailable to the authenticated user
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  message:
                    type: string
                    example: PIR device not found
  "/api/devices/trigger":
    post:
      summary: Publish the configured device trigger through MQTT
      tags:
      - Devices
      parameters: []
      responses:
        '200':
          description: trigger message published successfully
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - success
                    example: success
                  message:
                    type: string
                    example: Message sent successfully
        '422':
          description: stored trigger is not valid JSON
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                    example: error
                  message:
                    type: string
                    example: Invalid JSON format
        '404':
          description: device is not found
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - error
                    example: error
                  message:
                    type: string
                    example: Device not found
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - chip_id
              properties:
                chip_id:
                  type: string
                  description: Chip ID used to find the device whose stored trigger
                    will be published.
                  example: ESP32_ABC123
        required: true
  "/api/devices":
    get:
      summary: List all devices for the authenticated user
      tags:
      - Devices
      security:
      - bearerAuth: []
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  count:
                    type: integer
                  devices:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        chip_id:
                          type: string
                        device_type:
                          type: string
                          nullable: true
                        status:
                          type: integer
                          nullable: true
                        is_payment:
                          type: boolean
                          nullable: true
                        note:
                          type: string
                          nullable: true
                        url_firmware:
                          type: string
                          nullable: true
                        device_info:
                          type: object
                        meta_info:
                          type: object
                        created_at:
                          type: string
                          format: date_time
                          nullable: true
                        updated_at:
                          type: string
                          format: date_time
                          nullable: true
        '401':
          description: unauthorized
  "/api/auth/social_sessions":
    post:
      summary: Exchange a verified provider credential for a Binblog session
      tags:
      - Authentication
      description: Google ID token is verified server-side. Client email, UID, and
        verified flags are ignored. Returning and newly created accounts receive the
        normal Binblog JWT.
      parameters: []
      responses:
        '400':
          description: malformed request
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - code
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  code:
                    type: string
                    enum:
                    - malformed_request
        '200':
          description: existing or newly created Binblog session
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - token
                - user
                properties:
                  status:
                    type: string
                    enum:
                    - success
                  token:
                    type: string
                  user:
                    type: object
                    required:
                    - id
                    - username
                    - email
                    properties:
                      id:
                        type: integer
                      username:
                        type: string
                      email:
                        type: string
        '401':
          description: invalid or expired provider credential
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - code
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  code:
