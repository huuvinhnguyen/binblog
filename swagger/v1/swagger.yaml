---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/api/login":
    post:
      summary: Login user and return JWT token
      tags:
      - Authentication
      parameters: []
      responses:
        '200':
          description: successful login
        '401':
          description: invalid credentials
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - username
              - password
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  example: '123456'
  "/api/devices":
    get:
      summary: List all devices for the authenticated user
      tags:
      - Devices
      security:
      - bearerAuth: []
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  count:
                    type: integer
                  devices:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        chip_id:
                          type: string
                        device_type:
                          type: string
                          nullable: true
                        status:
                          type: integer
                          nullable: true
                        is_payment:
                          type: boolean
                          nullable: true
                        note:
                          type: string
                          nullable: true
                        url_firmware:
                          type: string
                          nullable: true
                        device_info:
                          type: object
                        meta_info:
                          type: object
                        created_at:
                          type: string
                          format: date_time
                          nullable: true
                        updated_at:
                          type: string
                          format: date_time
                          nullable: true
        '401':
          description: unauthorized
servers:
- url: https://{defaultHost}
  variables:
    defaultHost:
      default: www.example.com
