                    for this request.
                current_password:
                  type: string
                  format: password
        required: true
  "/api/auth/social_identities/{provider}":
    delete:
      summary: Unlink an owned Google identity
      tags:
      - Authentication
      security:
      - bearerAuth: []
      description: Requires a Binblog Bearer JWT and current local password for a
        mutation. Already absent identity returns not_linked. The final usable authentication
        method cannot be removed.
      parameters:
      - name: provider
        in: path
        required: true
        enum:
        - google
        schema:
          type: string
        description: ":\n * `google` \n "
      responses:
        '422':
          description: unsupported provider
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - code
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  code:
                    type: string
                    enum:
                    - unsupported_provider
        '200':
          description: unlinked or already absent
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - code
                properties:
                  status:
                    type: string
                    enum:
                    - success
                  code:
                    type: string
                    enum:
                    - unlinked
                    - not_linked
        '401':
          description: Binblog authentication required
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - code
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  code:
                    type: string
                    enum:
                    - authentication_required
        '403':
          description: fresh local-password proof required
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - code
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  code:
                    type: string
                    enum:
                    - reauthentication_required
        '500':
          description: identity persistence failure
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - code
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  code:
                    type: string
                    enum:
                    - internal_error
        '409':
          description: cannot remove the final authentication method
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - code
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  code:
                    type: string
                    enum:
                    - last_authentication_method
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - current_password
              properties:
                current_password:
                  type: string
                  format: password
  "/devices/notify":
    post:
      summary: Send a device notification to Slack
      tags:
      - Devices Webhook
      parameters: []
      responses:
        '200':
          description: notification received
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - status
                properties:
                  message:
                    type: string
                    example: Notification sent to Slack
                  status:
                    type: string
                    enum:
                    - success
                    - failure
                    example: success
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - message
              properties:
                id:
                  type: string
                  description: The device chip ID.
                  example: ESP32_ABC123
                message:
                  type: string
                  description: Notification text sent to Slack.
                  example: Relay 1 đã bật
                model:
                  type: string
                  description: Device model.
                  example: ESP32
                relay_state:
                  type: integer
                  description: Relay state reported by the device (0 = off, 1 = on).
                  enum:
                  - 0
                  - 1
                  example: 1
                relay_index:
                  type: integer
                  description: Zero-based relay index.
                  minimum: 0
                  example: 0
                name:
                  type: string
                  description: Device name used when the device is first registered.
                  example: Thiết bị phòng khách
        required: true
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT returned by POST /api/login. Send it as Bearer <token>.
servers:
- url: https://{defaultHost}
  variables:
    defaultHost:
      default: www.example.com
